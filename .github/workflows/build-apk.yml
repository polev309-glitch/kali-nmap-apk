name: Build Kivy APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade "pip<25" setuptools wheel
          pip install buildozer==1.5.0 "cython<3" virtualenv

      - name: Set JAVA_HOME to Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find ~/.buildozer/android/platform/android-sdk -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses 2>/dev/null || true
            mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin/
            ln -sf $SDKMANAGER ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
            $SDKMANAGER --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;29.0.0" || true
          else
            echo "sdkmanager NOT FOUND — SDK not downloaded yet. Skipping."
          fi

      - name: Download and unpack KivyMD
        run: |
          mkdir -p /tmp/kivymd_src
          pip download kivymd==1.1.1 --no-deps --no-binary=:all: -d /tmp/kivymd_src
          cd /tmp/kivymd_src
          tar -xzf kivymd-1.1.1.tar.gz
          cp -r kivymd-1.1.1/kivymd $GITHUB_WORKSPACE/
          ls -la $GITHUB_WORKSPACE/kivymd | head

      - name: Clean previous build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
