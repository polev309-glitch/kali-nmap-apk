name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade "pip<25" setuptools wheel
          pip install buildozer "cython<3" virtualenv

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Download and unpack KivyMD
        run: |
          mkdir -p /tmp/kivymd_src
          pip download kivymd==1.1.1 --no-deps --no-binary=:all: -d /tmp/kivymd_src
          cd /tmp/kivymd_src
          tar -xzf kivymd-1.1.1.tar.gz
          cp -r kivymd-1.1.1/kivymd $GITHUB_WORKSPACE/
          ls -la $GITHUB_WORKSPACE/kivymd | head

      - name: Clean previous build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-apk
          path: bin/*.apk
